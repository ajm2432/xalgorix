
# SeasideSec local overrides. Compose merges this file automatically with docker-compose.yml.
services:
  xalgorix:
    build: .
    image: xalgorix:local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      XALGORIX_LLM: ollama/qwen3:14b
      XALGORIX_API_BASE: http://host.docker.internal:11434/v1
      # Reasoning tokens share the max_tokens budget with the visible reply.
      XALGORIX_REASONING_EFFORT: medium
      XALGORIX_MAX_OUTPUT_TOKENS: 8192
      # Must match the host's OLLAMA_CONTEXT_LENGTH or Ollama silently truncates prompts.
      XALGORIX_LLM_CONTEXT_WINDOW: 32768
      XALGORIX_NATIVE_TOOL_CALLS: "true"
